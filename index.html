<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Operacional</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0f1c;
      color: #e5e7eb;
    }

    header {
      padding: 15px;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      background: #111827;
      border-bottom: 2px solid #1f2937;
    }

    .metrics {
      display: flex;
      justify-content: space-around;
      padding: 10px;
      background: #020617;
      border-bottom: 1px solid #1f2937;
      font-size: 14px;
    }

    /* 🔥 DASH LAYOUT */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 15px;
    }

    .dash {
      display: flex;
      align-items: center;
      gap: 20px;
      justify-content: flex-start;
      background: #111827;
      padding: 12px 16px;
      border-radius: 8px;
      border-left: 6px solid #374151;
      font-size: 18px;
    }

    .dash:hover {
      background: #1f2937;
    }

    .left {
      font-weight: bold;
      font-size: 20px;
      min-width: 180px;
    }

    .right {
      font-size: 20px;
      font-weight: bold;
      background: #020617;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #1f2937;
    }

    .rtg { border-color: #38bdf8; color: #38bdf8; }
    .vazio { border-color: #22c55e; color: #22c55e; }
    .cheio { border-color: #facc15; color: #facc15; }

    .editor {
      padding: 10px;
      background: #020617;
      border-top: 1px solid #1f2937;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input, select, button {
      padding: 8px;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #22c55e;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>🚢 Painel Operacional</header>

<div class="metrics">
  <div>Total: <span id="total"></span></div>
  <div>RTG: <span id="rtg"></span></div>
  <div>Vazio: <span id="vazio"></span></div>
  <div>Cheio: <span id="cheio"></span></div>
</div>

<div class="grid" id="grid"></div>

<div class="editor">
  <input id="nome" placeholder="Nome">
  <select id="tipo">
    <option value="R">RTG</option>
    <option value="V">Vazio</option>
    <option value="E">Cheio</option>
  </select>
  <input id="maquina" placeholder="Ex: 07">
  <input id="local" placeholder="Local (ex: Pátio A)">
  <button onclick="add()">Adicionar</button>
</div>

<script>
  let operadores = JSON.parse(localStorage.getItem("ops")) || [];

  function salvar() {
    localStorage.setItem("ops", JSON.stringify(operadores));
  }

  function tipoClasse(cod) {
    if (cod.startsWith("R")) return "rtg";
    if (cod.startsWith("V")) return "vazio";
    return "cheio";
  }

  function render() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    let countRTG = 0, countV = 0, countE = 0;

    operadores.forEach((op, index) => {
      const dash = document.createElement("div");
      const classe = tipoClasse(op.maquina);

      if (classe === "rtg") countRTG++;
      if (classe === "vazio") countV++;
      if (classe === "cheio") countE++;

      dash.className = "dash " + classe;

      dash.innerHTML = `
        <div class="left">${op.nome}</div>
        <div class="right">${op.maquina}</div>
        <div style="font-size:14px;opacity:0.7;min-width:140px">${op.local || "-"}</div>
        <button onclick="remover(${index})" style="margin-left:auto;background:#ef4444;color:white;border:none;padding:6px 10px;border-radius:6px;cursor:pointer">✖</button>
      `;

      grid.appendChild(dash);
    });

    document.getElementById("total").innerText = operadores.length;
    document.getElementById("rtg").innerText = countRTG;
    document.getElementById("vazio").innerText = countV;
    document.getElementById("cheio").innerText = countE;
  }

  function remover(index) {
    operadores.splice(index, 1);
    salvar();
    render();
  }

  function add() {
    const nome = document.getElementById("nome").value;
    const tipo = document.getElementById("tipo").value;
    const maquina = document.getElementById("maquina").value;

    if (!nome || !maquina) return;

    const local = document.getElementById("local").value;
    operadores.push({ nome, maquina: tipo + maquina, local });
    salvar();
    render();
  }

  window.addEventListener("storage", () => {
    operadores = JSON.parse(localStorage.getItem("ops")) || [];
    render();
  });

  render();
</script>

</body>
</html>
